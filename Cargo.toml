[package]
name = "rpi_fft"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "build.rs"


[dependencies]
log = "~0.4"
env_logger = "~0.11"

#
# Internal
sal-core = { tag = "0.1.0", git = "https://github.com/a-givertzman/rust-sal-core.git" }
sal-sync = { tag = "0.3.0", git = "https://github.com/a-givertzman/rust-sal-sync.git" }

#
# Regex
regex = "~1.11"

rustfft = "~6.4"
heapless = "~0.9"
num = "~0.4"
chrono = "~0.4"
ringbuf = "~0.4"
flume = "~0.11"

#
# Collections
linked-hash-map = "~0.5"
indexmap = "~2.11"
hashers = "~1.0"
concurrent-queue = "~2.5"

#
# fast string concatinations
concat-string = "~1.0"

#
# Serde
serde = { version = "~1.0", features = ["derive"] }
serde_yaml = "~0.9"
serde_json = "~1.0"
serde_with = "~3.15"

#
# Tread safe
parking_lot = "~0.12"
once_cell = "~1.21"

#
# Ui
egui = "~0.33"
egui_plot = "~0.34"
eframe = "~0.33"

# snap7 = "~0.0.1"
snap7-sys = "~0.1.5"

# [[example]]
# name = "test_queue" # examples/test_queue.rs
# [[example]]
# name = "test_channel" # examples/test_channel.rs
# [[example]]
# name = "test_treadsafe_queue" # examples/test_treadsafe_queue.rs